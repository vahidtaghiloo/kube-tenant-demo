---
# Default-deny on the PRIMARY cluster network, then allow intra-namespace
# traffic.
#
# A NetworkPolicy is enforced by the primary CNI (Calico) on eth0. It does
# NOT govern the Multus secondary interface -- net1 traffic never passes
# through Calico's dataplane at all. So the two isolation mechanisms in this
# demo are genuinely different layers:
#   * eth0 (management plane) -> isolated by NetworkPolicy, at L3/L4
#   * net1 (data plane)       -> isolated by the VLAN / VF, at L2
# That split is precisely how real telco infrastructure sharing is built.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tenant-a
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: tenant-a
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tenant-b
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: tenant-b
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
